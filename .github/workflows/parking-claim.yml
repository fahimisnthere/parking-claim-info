name: Parking claim

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview first. process-new uploads statements and writes claims.'
        required: true
        default: preview-latest
        type: choice
        options:
          - preview-latest
          - preview-new
          - process-new
  schedule:
    # UTC: approximately 08:17 and 20:17 Malaysia time. Schedules can be delayed.
    - cron: '17 0,12 * * *'

permissions:
  contents: read

concurrency:
  group: parking-claim-writer
  cancel-in-progress: false

jobs:
  claim:
    if: github.event_name == 'workflow_dispatch' || vars.CLAIM_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run parking claim
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          CLAIM_START_AFTER: ${{ vars.CLAIM_START_AFTER }}
          CLAIM_MODE: ${{ inputs.mode || 'process-new' }}
          PYTHONUNBUFFERED: '1'
        run: python cloud_claim.py --mode "$CLAIM_MODE"
